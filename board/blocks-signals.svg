<rect x='20' y='210' width='220' height='80' rx='8' fill='#eef4fb' stroke='#1f2328' stroke-width='1.4' stroke-dasharray='6 4'/>
<text x='130.0' y='237.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>U7</text>
<text x='130.0' y='255.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the sensor: the Belka's</text>
<text x='130.0' y='273.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>and Kryska's</text>
