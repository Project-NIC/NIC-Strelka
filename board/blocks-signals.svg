<text x='320.0' y='244.0' font-size='12' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>SPI, INT1, pin 9</text>
<rect x='20' y='345' width='220' height='60' rx='8' fill='#eef4fb' stroke='#1f2328' stroke-width='1.4' stroke-dasharray='6 4'/>
<text x='130.0' y='371.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>J3</text>
<text x='130.0' y='389.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the card, the Belka's</text>
<polyline points='240,375 400,375' fill='none' stroke='#1f2328' stroke-width='2'/>
<text x='320.0' y='369.0' font-size='12' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>SPI, SD_EN to U6</text>
<rect x='20' y='435' width='220' height='60' rx='8' fill='#eef4fb' stroke='#1f2328' stroke-width='1.4' stroke-dasharray='6 4'/>
<text x='130.0' y='461.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>U3</text>
<text x='130.0' y='479.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the flash, Kryska's</text>
<polyline points='240,465 400,465' fill='none' stroke='#1f2328' stroke-width='2'/>
<text x='320.0' y='459.0' font-size='12' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>SPI</text>
<rect x='20' y='556' width='26' height='14' rx='3' fill='#eef4fb' stroke='#1f2328' stroke-dasharray='6 4'/>
<text x='54' y='567' font-size='12' text-anchor='start' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>not on every board</text>
<text x='20' y='544' font-size='12' text-anchor='start' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>Beside: the SWD pads, Tag-Connect's TC2030-NL, for the first firmware.</text>
<text x='20' y='588' font-size='10' text-anchor='start' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>Licence: CERN-OHL-P v2. The parts, the nets and their values: BOARD.md.</text>
