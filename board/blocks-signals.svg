<text x='870.0' y='84.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>magnet A</text>
<rect x='760' y='140' width='220' height='80' rx='8' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.4'/>
<text x='870.0' y='167.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>U2</text>
<text x='870.0' y='185.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the PMIC: the charge,</text>
<text x='870.0' y='203.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the off, the gauge's measures</text>
