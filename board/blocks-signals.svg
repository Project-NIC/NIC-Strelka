<text x='130.0' y='94.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the contact, through D2</text>
<polyline points='240,80 400,80' fill='none' stroke='#1f2328' stroke-width='2'/>
