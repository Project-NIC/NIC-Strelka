<rect width='1000' height='600' fill='#ffffff'/>
<text x='20' y='30' font-size='17' text-anchor='start' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>Materinka — the signals: what the processor talks to</text>
<rect x='400' y='50' width='200' height='470' rx='8' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.4'/>
<text x='500.0' y='218.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>U1</text>
<text x='500.0' y='236.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the module:</text>
<text x='500.0' y='254.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the nRF54LM20A,</text>
<text x='500.0' y='272.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the BM20F, the BM20M,</text>
<text x='500.0' y='290.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>or the WM02C20C,</text>
<text x='500.0' y='308.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the nRF7002 inside</text>
<text x='500.0' y='326.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'></text>
<text x='500.0' y='344.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the sensor read by</text>
<text x='500.0' y='362.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>its second core, the FLPR</text>
<rect x='760' y='40' width='220' height='60' rx='8' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.4'/>
