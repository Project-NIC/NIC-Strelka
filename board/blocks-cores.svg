<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='680' viewBox='0 0 1000 680'>
<defs><marker id='arrow067647' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#067647'/></marker><marker id='arrow175cd3' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#175cd3'/></marker><marker id='arrow1f2328' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2328'/></marker><marker id='arrow57606a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#57606a'/></marker><marker id='arrow6941c6' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6941c6'/></marker><marker id='arrowb42318' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#b42318'/></marker></defs>
<rect width='1000' height='680' fill='#ffffff'/>
<text x='20' y='30' font-size='17' text-anchor='start' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>Strelka — the processor's two cores: who does what</text>
<rect x='380' y='60' width='240' height='110' rx='8' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.4'/>
<text x='500.0' y='93.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>Core B, the FLPR</text>
<text x='500.0' y='111.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>RISC-V, its own 96 KB of RAM</text>
<text x='500.0' y='129.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the sensor alone: found, set,</text>
<text x='500.0' y='147.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>every sample read</text>
<rect x='40' y='60' width='220' height='110' rx='8' fill='#eef4fb' stroke='#1f2328' stroke-width='1.4' stroke-dasharray='6 4'/>
<text x='150.0' y='102.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>U7</text>
<text x='150.0' y='120.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the sensor: LSM6DSV16X,</text>
<text x='150.0' y='138.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>LSM6DSV320X or ICM-42686-P</text>
<rect x='40' y='215' width='220' height='80' rx='8' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.4'/>
<text x='150.0' y='242.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>TIMER22</text>
<text x='150.0' y='260.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the data-ready's stamp,</text>
<text x='150.0' y='278.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>captured in hardware</text>
<rect x='380' y='235' width='240' height='100' rx='8' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.4'/>
<text x='500.0' y='263.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>the ring, in RAM both see</text>
<text x='500.0' y='281.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>its head of 32 B: the commands,</text>
<text x='500.0' y='299.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the state, the temperature;</text>
<text x='500.0' y='317.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>1 024 samples, each stamped</text>
<rect x='330' y='400' width='340' height='170' rx='8' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.4'/>
<text x='500.0' y='445.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>Core A, the main one</text>
<text x='500.0' y='463.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>Arm Cortex-M33</text>
<text x='500.0' y='481.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the set's time: the SYNC, the clock's loop,</text>
<text x='500.0' y='499.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the sensor's clock on pin 9;</text>
<text x='500.0' y='517.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the steps on the grid, the turn, the record;</text>
<text x='500.0' y='535.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the commands, the gauge, the light</text>
<rect x='40' y='400' width='220' height='70' rx='8' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.4'/>
<text x='150.0' y='431.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>the radio</text>
<text x='150.0' y='449.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>Strelka's frame and ESB</text>
<rect x='40' y='500' width='220' height='70' rx='8' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.4'/>
<text x='150.0' y='531.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>J1, USB</text>
<text x='150.0' y='549.0' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the disk, MCUboot's recovery</text>
<rect x='740' y='390' width='220' height='55' rx='8' fill='#eef4fb' stroke='#1f2328' stroke-width='1.4' stroke-dasharray='6 4'/>
<text x='850.0' y='413.5' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>J3 or U3</text>
<text x='850.0' y='431.5' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the card or the flash</text>
<rect x='740' y='460' width='220' height='55' rx='8' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.4'/>
<text x='850.0' y='483.5' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>U2, U9</text>
<text x='850.0' y='501.5' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the PMIC, magnet B</text>
<rect x='740' y='530' width='220' height='55' rx='8' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.4'/>
<text x='850.0' y='553.5' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>the nRF7002</text>
<text x='850.0' y='571.5' font-size='12' text-anchor='middle' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>the Wi-Fi, Povodok alone</text>
<polyline points='260,115 380,115' fill='none' stroke='#1f2328' stroke-width='2'/>
<text x='320.0' y='109.0' font-size='12' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>SPIM21</text>
<polyline points='150,170 150,215' fill='none' stroke='#1f2328' stroke-width='2' marker-end='url(#arrow1f2328)'/>
<text x='158.0' y='196.5' font-size='12' text-anchor='start' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>INT1</text>
<polyline points='260,255 320,255 320,150 380,150' fill='none' stroke='#1f2328' stroke-width='2'/>
<text x='312.0' y='206.5' font-size='12' text-anchor='end' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>the stamp</text>
<polyline points='500,170 500,235' fill='none' stroke='#1f2328' stroke-width='2' marker-end='url(#arrow1f2328)'/>
<text x='508.0' y='206.5' font-size='12' text-anchor='start' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>the samples in</text>
<polyline points='500,335 500,400' fill='none' stroke='#1f2328' stroke-width='2'/>
<text x='508.0' y='371.5' font-size='12' text-anchor='start' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>out every millisecond; the commands</text>
<polyline points='260,435 330,435' fill='none' stroke='#1f2328' stroke-width='2'/>
<polyline points='260,535 330,535' fill='none' stroke='#1f2328' stroke-width='2'/>
<polyline points='670,417 740,417' fill='none' stroke='#1f2328' stroke-width='2'/>
<text x='705.0' y='411.0' font-size='12' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>SPIM20</text>
<polyline points='670,487 740,487' fill='none' stroke='#1f2328' stroke-width='2'/>
<text x='705.0' y='481.0' font-size='12' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>I²C, pins</text>
<polyline points='670,557 740,557' fill='none' stroke='#1f2328' stroke-width='2'/>
<text x='705.0' y='551.0' font-size='12' text-anchor='middle' font-weight='bold' fill='#1f2328' font-family='DejaVu Sans, Arial, sans-serif'>SPIM22</text>
<rect x='20' y='636' width='26' height='14' rx='3' fill='#eef4fb' stroke='#1f2328' stroke-dasharray='6 4'/>
<text x='54' y='647' font-size='12' text-anchor='start' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>not on every board</text>
<text x='20' y='624' font-size='12' text-anchor='start' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>Either core can drive any of the buses, one at a time, by turns agreed in software.</text>
<text x='20' y='668' font-size='10' text-anchor='start' font-weight='normal' fill='#57606a' font-family='DejaVu Sans, Arial, sans-serif'>Licence: CERN-OHL-P v2. Who does what: FIRMWARE.md, The sensor on the FLPR.</text>
</svg>
