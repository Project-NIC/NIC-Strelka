include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    # written by flutter gen-l10n, its delegates' list still the old Material's; main.dart lists
    # its own
    - lib/l10n/app_localizations*.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - unawaited_futures
