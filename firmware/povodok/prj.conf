# NIC-Strelka — Povodok's own Zephyr configuration; what both units share is
# ../shared/common.conf (FIRMWARE.md). Built against nRF Connect SDK v3.4.0; not run on hardware.

# the Wi-Fi: the nRF7002 inside the WM02C20C, a station at 5 GHz, clear of the set's band;
# coexistence with the radio on the module's pins (FIRMWARE.md, The pins)
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NRF70_STA_MODE=y
CONFIG_NRF70_SR_COEX=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NRF70_RX_NUM_BUFS=16
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=40000

# TCP/IP to the application, over the Wi-Fi and over USB alike (PHONE.md)
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
# SMP over TCP: a listening socket for Povodok's own port and one for each Belka taken, up to
# 63, and eight connections at once (shared/smp_tcp.c)
CONFIG_NET_MAX_CONN=128
CONFIG_NET_MAX_CONTEXTS=128
CONFIG_ZVFS_OPEN_MAX=128
CONFIG_ZVFS_POLL_MAX=128
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4

# the phone's USB: a network adapter, CDC-NCM, beside the serial port (FIRMWARE.md, USB)
CONFIG_USBD_CDC_NCM_CLASS=y

# Bluetooth LE in the first minutes after it is switched on alone, to receive the network's name
# and password, then off before ESB and the frame take the radio (FIRMWARE.md, The platform)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Strelka Povodok"
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=1

# the heap and the stacks for the network stacks
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
