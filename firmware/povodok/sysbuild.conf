# NIC-Strelka — sysbuild: MCUboot as the boot loader, two image slots, the images signed with the
# maker's key, which is not in the repository — given at the build:
#     west build ... -- -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"/path/to/strelka.pem\"
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
