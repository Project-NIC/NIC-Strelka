# MCUboot: the serial recovery through the contact's USB port — with VBUS present at power-on
# MCUboot brings the port up and listens three seconds for a command; without VBUS it boots at
# once: the VBUS gate, Strelka's module ../shared/vbusgate, asked by the patch in ../patches/,
# which the build needs applied (west patch apply); the module also sets HOLD high first
# (FIRMWARE.md, USB; The hold). The USB driver's own wait for VBUS is bounded, so that nothing
# blocks for good should the gate be missing. No pin starts the recovery; MCUboot has no
# console, as Nordic's own nRF54LM20 dongle has none.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=3000
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_MANUFACTURER="NIC"
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_PRODUCT="Strelka recovery"
CONFIG_STRELKA_VBUS_GATE=y
CONFIG_STRELKA_HOLD_PIN=55
CONFIG_UDC_DWC2_USBHS_VBUS_READY_TIMEOUT=200
CONFIG_GPIO=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
