# NIC-Strelka — the console over RTT, for the development kit alone: the log and the console go
# to SEGGER RTT through the kit's own J-Link, on the DEBUGGER USB cable, so that no second cable
# is needed to read them; the USB port on the contact's pair stays MCUboot's and SMP's. Added to
# a build by -D<project>_EXTRA_CONF_FILE (firmware/README.md, Building); never in a unit's image.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
