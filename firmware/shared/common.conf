# NIC-Strelka — what the Belka's and Povodok's Zephyr configurations share (FIRMWARE.md). Each
# project adds its own in prj.conf. Built against nRF Connect SDK v3.4.0; not run on hardware.

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y

# TIMER21, TIMER22, GPIOTE20 and DPPIC20 are driven through the HAL by shared/clock.c, no nrfx
# driver and no devicetree node of theirs enabled, so that no Zephyr driver takes them; TIMER10,
# TIMER20 and channel 0 of the DPPICs and the PPIBs are MPSL's and ESB's. GPIOTE20's channels
# are to be taken through nrfx_gpiote_channel_alloc, beside Zephyr's GPIO driver: the kit's work.

# the radio: ESB for the commands, the download and the firmware; Strelka's frame on the same
# radio, in turns (shared/link.h). ESB with dynamic interrupts, so that MPSL is whole, not its
# FEM-only cut: Povodok's Bluetooth LE controller needs it, and the FEM-only cut leaves MPSL's
# low-latency callbacks unresolved at the link on the nRF54LM20A (found at the first build)
CONFIG_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=252
CONFIG_ESB_DYNAMIC_INTERRUPTS=y
CONFIG_MPSL=y

# the cryptography: CRACEN through PSA — AES-CCM for the fragments and the SYNC, SHA-256 and
# HMAC for the lock, X25519 for the taking (shared/crypto_psa.c)
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y

# the firmware's own updates: MCUboot, MCUmgr's groups — the system, the images, the files —
# and Strelka's group 64 (COMMANDS.md); the transports are Strelka's own, over ESB and over TCP
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2048
# group 64's answers nest a list of maps in the main map, and the set's view carries a line a
# Belka; the handlers run on MCUmgr's own work queue
CONFIG_MCUMGR_SMP_CBOR_MAX_DECODING_LEVELS=4
CONFIG_MCUMGR_SMP_CBOR_MAX_ENCODING_LEVELS=4
CONFIG_MCUMGR_SMP_CBOR_MAX_MAIN_MAP_ENTRIES=16
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096

# what a unit keeps across power-ons: the set's address, key, channel and its number, the
# calibration, the gauge's learned values — Zephyr's settings on ZMS in the storage partition
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_ZMS=y

# USB on the contact's pair: the device stack and the serial port for the console, both units;
# the device is enabled on the stack's VBUS message alone (shared/usb.c), and the driver's own
# wait for VBUS is bounded, so that nothing blocks for good
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UDC_DWC2_USBHS_VBUS_READY_TIMEOUT=200

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_FPU=y
