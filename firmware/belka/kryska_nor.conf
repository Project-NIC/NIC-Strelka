# NIC-Strelka — Kryska's other way, its memory NOR flash (chapters/kryska-memory.md), over the
# Belka's configuration (boards/kryska_nor.overlay): the flash on SPIM20
# in the card's place, through Zephyr's SPI NOR driver; the card's SD stack, its FatFs and its USB
# disk left out, src/flash_rec.c behind the card's interface, the record raw on the flash and the
# sessions as files of a file system of its own. Built against nRF Connect SDK v3.4.0;
# not run on hardware.
CONFIG_SDHC=n
CONFIG_SPI_SDHC=n
CONFIG_SDMMC_STACK=n
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_SPI_NOR=y
CONFIG_FAT_FILESYSTEM_ELM=n
CONFIG_FS_FATFS_EXTRA_NATIVE_API=n
CONFIG_FILE_SYSTEM_MKFS=n
CONFIG_USBD_MSC_CLASS=n
# the sessions' names, S00007B03_2.STRK and on, where no FatFs sets the length
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=31
# SMP on the serial port on the cable, Zephyr's SMP over console framing beside the console's
# own lines: the set given as STRELKA.SET into the record's file system, and the download by the
# cable (FIRMWARE.md, USB; COMMANDS.md)
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_TRANSPORT_UART_MTU=2048
CONFIG_BASE64=y
CONFIG_CRC=y
# Kryska in 64/0's kind
CONFIG_STRELKA_KRYSKA=y
# the cell's end voltage until Kryska's cell is chosen: a Li-poly cell's 3,30 V
CONFIG_STRELKA_CELL_EMPTY_MV=3300
# BUCK2 in PWM while a record runs (Kconfig, FIRMWARE.md, The PMIC)
CONFIG_STRELKA_BUCK2_PWM_RECORDING=y
