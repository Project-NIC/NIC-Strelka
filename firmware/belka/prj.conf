# NIC-Strelka — the Belka's own Zephyr configuration; what both units share is
# ../shared/common.conf (FIRMWARE.md). Built against nRF Connect SDK v3.4.0; not run on hardware.

# MPSL never started: no protocol of its own runs on the Belka, so it holds neither the radio nor
# TIMER10, and ESB and the frame take turns alone (FIRMWARE.md, The platform)
CONFIG_MPSL_FEM_ONLY=y
# and so no MPSL to take down before MCUmgr's reset: the SDK's reboot hook off, its prompt given in
# Kconfig (DevZone 129531)
CONFIG_MCUMGR_GRP_OS_REBOOT_BT=n

# the card on SPIM20: Zephyr's SD stack over SPI, FatFs with long names and exFAT, the disk "SD"
# (FIRMWARE.md, The record; RECORD.md, The file)
CONFIG_DISK_ACCESS=y
CONFIG_SDHC=y
CONFIG_SPI_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=64
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
# f_expand, the file's room taken in one run at the start (FIRMWARE.md, The record)
CONFIG_FS_FATFS_EXTRA_NATIVE_API=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y

# the card as a disk on the cable, read-only (FIRMWARE.md, USB)
CONFIG_USBD_MSC_CLASS=y

# the files' group of MCUmgr: the record's download, 8/0–8/2 (COMMANDS.md); a file up to 4 GB,
# its offsets of five bytes in the frame, where Zephyr's default stops at 64 KB
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y
CONFIG_MCUMGR_GRP_FS_FILE_STATUS=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH=y
CONFIG_MCUMGR_GRP_FS_HASH_SHA256=y

# the sensor's thread reads at every data-ready; the writer below it takes the blocks to the card
CONFIG_NUM_PREEMPT_PRIORITIES=16
