# NIC-Strelka — Kryska's configuration over the Belka's (boards/kryska.overlay): its SD NAND served
# as the Belka's card, the same SD stack, FatFs and USB disk (KRYSKA.md). Built against nRF Connect
# SDK v3.4.0; not run on hardware.
# Kryska in 64/0's kind
CONFIG_STRELKA_KRYSKA=y
# the cell's end voltage until Kryska's cell is chosen: a Li-poly cell's 3,30 V
CONFIG_STRELKA_CELL_EMPTY_MV=3300
# BUCK2 in PWM while a record runs (Kconfig, FIRMWARE.md, The PMIC)
CONFIG_STRELKA_BUCK2_PWM_RECORDING=y
