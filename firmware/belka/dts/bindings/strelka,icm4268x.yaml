# NIC-Strelka — the motion sensor on its SPI: an ICM-42688-P or an ICM-42686-P, one land.

description: TDK ICM-42688-P or ICM-42686-P on SPI, with its data-ready and CLKIN pins

compatible: "strelka,icm4268x"

include: spi-device.yaml

properties:
  int-gpios:
    type: phandle-array
    required: true
    description: INT1, the data-ready, captured by a timer in hardware

  clkin-gpios:
    type: phandle-array
    required: true
    description: CLKIN on the sensor's pin 9, made by a timer of the 16 MHz clock
